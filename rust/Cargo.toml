[workspace]
members = ["crates/offcoder-core", "crates/offcoderd"]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["stream", "json"] }
futures-util = "0.3"
async-trait = "0.1"
tokio-stream = "0.1"
